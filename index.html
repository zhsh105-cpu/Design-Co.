<title>平面设计咨询单</title>
<style>
/* 布局：单列，依次为服务项目、咨询摘要与联系方式 */
:root {
  --bg: #f1f4f6; --surface: #ffffff; --fg: #12181f; --muted: #5d6a76; --line: #d9e0e6;
  --accent: #0a74c9; --accent-soft: #dcecf8; --accent-fg: #ffffff; --ok: #167a4a;
  --font-display: "PingFang SC", "Microsoft YaHei", "微软雅黑", "Hiragino Sans GB", "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif;
  --font-body: "PingFang SC", "Microsoft YaHei", "微软雅黑", "Hiragino Sans GB", "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif;
  --font-mono: Consolas, Menlo, "Courier New", "Microsoft YaHei", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #171f27; --fg: #e8edf1; --muted: #93a1ad; --line: #2a3541;
    --accent: #4ab0f5; --accent-soft: #17303f; --accent-fg: #0a1620; --ok: #55c98d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #171f27; --fg: #e8edf1; --muted: #93a1ad; --line: #2a3541;
  --accent: #4ab0f5; --accent-soft: #17303f; --accent-fg: #0a1620; --ok: #55c98d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; padding-inline: 16px; padding-block: 28px 56px; }
.wrap { max-width: 720px; margin-inline: auto; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 24px; }
h1 { font-family: var(--font-display); font-size: clamp(26px, 5vw, 36px); line-height: 1.2; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: right; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
h2 { font-size: 13px; letter-spacing: .12em; color: var(--muted); font-weight: 500; margin: 0 0 14px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
input[type=text], input[type=date], select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; width: 100%; }
textarea { resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cb:focus-within .row { outline: 2px solid var(--accent); outline-offset: 2px; }

.svc { border-top: 1px solid var(--line); padding-block: 14px; }
.svc:first-of-type { border-top: 0; padding-top: 0; }
.svc:last-child { padding-bottom: 0; }
.cb { position: relative; display: block; cursor: pointer; }
.cb input { position: absolute; opacity: 0; pointer-events: none; }
.row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 12px; align-items: start; border-radius: 6px; }
.box { width: 20px; height: 20px; margin-top: 2px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--bg); display: grid; place-items: center; }
.box::after { content: ""; width: 10px; height: 5px; border-left: 2px solid var(--accent-fg); border-bottom: 2px solid var(--accent-fg); transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
.cb input:checked ~ .row .box { background: var(--accent); border-color: var(--accent); }
.cb input:checked ~ .row .box::after { opacity: 1; }
.name { font-weight: 700; }
.desc { color: var(--muted); font-size: 13px; grid-column: 2; }
.from { font-family: var(--font-mono); font-size: 13px; color: var(--accent); text-align: right; white-space: nowrap; }
.svc.on .name { color: var(--accent); }
.opts { display: none; margin: 12px 0 0 34px; gap: 10px 12px; flex-wrap: wrap; align-items: center; }
.svc.on .opts { display: flex; }
.opts select { width: auto; max-width: 100%; flex: 1 1 200px; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); }
.step button { font: inherit; width: 34px; height: 34px; border: 0; background: transparent; color: var(--fg); cursor: pointer; font-size: 18px; }
.step button:hover { background: var(--accent-soft); }
.step output { min-width: 40px; text-align: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.unit { font-size: 13px; color: var(--muted); }

fieldset { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
fieldset:last-child { margin-bottom: 0; }
legend { font-size: 13px; color: var(--muted); padding: 0; margin-bottom: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: inline-block; padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 14px; }
.seg input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.sheet { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 4px 4px 8px 8px; padding: 20px; }
.sheet h3 { font-family: var(--font-display); font-size: 20px; margin: 0 0 2px; }
.sheet .no { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin: 0 0 14px; }
.lines { list-style: none; margin: 0; padding: 0; }
.lines li { display: flex; justify-content: space-between; gap: 12px; padding-block: 6px; border-bottom: 1px dashed var(--line); font-size: 14px; }
.lines li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.lines li span:last-child, .tot span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lines li.empty { color: var(--muted); border-bottom: 0; }
.tot { display: flex; justify-content: space-between; gap: 12px; padding-block: 4px; font-size: 14px; color: var(--muted); }
.tot.grand { color: var(--fg); font-size: 16px; font-weight: 700; padding-top: 12px; margin-top: 8px; border-top: 2px solid var(--fg); }
.tot.grand span:last-child { font-size: 24px; color: var(--accent); }
.note { font-size: 12px; color: var(--muted); margin: 12px 0 0; }
.contact { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.pay { flex: 1 1 150px; min-width: 0; display: grid; gap: 6px; }
.prow { display: grid; grid-template-columns: 4.5em minmax(0, 1fr); gap: 8px; font-size: 13px; }
.prow span:first-child { color: var(--muted); }
.prow .ph { font-family: var(--font-mono); font-size: 15px; font-weight: 700; user-select: all; }
.qr { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.qrbox { width: 120px; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #ffffff; }
.qrbox img { display: block; width: 100%; height: auto; }
.qrcap { font-size: 13px; color: var(--muted); }
.actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
button.main { font: inherit; font-weight: 500; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; flex: 1 1 auto; }
button.ghost { font: inherit; background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; cursor: pointer; }
button.main:hover { filter: brightness(1.08); }
button.ghost:hover { background: var(--accent-soft); }
#fallback { width: 100%; margin-top: 10px; min-height: 140px; font-family: var(--font-mono); font-size: 12px; }
#status { font-size: 13px; color: var(--ok); min-height: 20px; margin: 8px 0 0; }
</style>

<script>
/* 参考价为示例，可按你的标准修改。qty 表示按数量计价。 */
var SERVICES = [
  { id: "logo", name: "LOGO 设计", desc: "标志设计，含方向提案与修改，交付可商用文件。",
    options: [
      { id: "a", label: "基础版：2 个方案", price: 600 },
      { id: "b", label: "标准版：2 个方案，含标准字与辅助图形", price: 900 },
      { id: "c", label: "高级版：3 个方案，含品牌色与简版规范", price: 1800 }
    ] },
  { id: "month", name: "包月服务", desc: "固定月费，长期设计支持，适合每月都有出图需求的商家。",
    qty: true, unit: "个月", def: 1,
    options: [
      { id: "a", label: "标准月包：不限任务，工作时间：8：00-17：00", price: 2800 },
      { id: "b", label: "高级月包：不限任务，工作时间：不限", price: 8800 }
    ] },
  { id: "brand", name: "品牌设计", desc: "在 LOGO 基础上延展名片、包装、门店等应用。",
    options: [
      { id: "a", label: "基础 VI：LOGO + 名片 + 信纸", price: 3000 },
      { id: "b", label: "完整 VI：含应用延展与规范手册", price: 6000 },
      { id: "c", label: "品牌全案：定位、命名、视觉系统", price: 12000 }
    ] },
  { id: "vec", name: "矢量复刻", desc: "把模糊图、位图、手绘稿重绘成可无限放大的矢量文件。",
    qty: true, unit: "个", def: 1,
    options: [
      { id: "a", label: "简单图形 / 文字 Logo", price: 80 },
      { id: "b", label: "复杂图形 / 插画", price: 200 }
    ] },
  { id: "book", name: "画册设计", desc: "企业宣传册、产品手册、招商册，含排版与版式。",
    qty: true, unit: "页", def: 12, tag: "100元/p",
    options: [
      { id: "a", label: "画册排版设计", price: 100 }
    ] },
  { id: "floorheat", name: "地暖图绘制", desc: "地暖管线布置图绘制，按建筑面积计价。",
    tag: "2-5元/m²",
    options: [
      { id: "a", label: "地暖图绘制", price: 2, note: "2-5 元 / m²" }
    ] },
  { id: "mech", name: "机械图新绘", desc: "机械零件图、装配图新绘。",
    tag: "100元起",
    options: [
      { id: "a", label: "机械图新绘", price: 100, note: "100 元起" }
    ] }
];
var state = { on: {}, opt: {}, qty: {} };

function $(id) { return document.getElementById(id); }
function yuan(n) { return "¥" + Math.round(n).toLocaleString("zh-CN"); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function find(list, id) { return list.filter(function (o) { return o.id === id; })[0]; }
function lowest(s) { return Math.min.apply(null, s.options.map(function (o) { return o.price; })); }

function initState() {
  state.on = {}; state.opt = {}; state.qty = {};
  SERVICES.forEach(function (s) {
    state.on[s.id] = (s.id === "logo");
    state.opt[s.id] = s.options[0].id;
    state.qty[s.id] = s.qty ? s.def : 1;
  });
}

var now = new Date();
$("qno").textContent = "No. Q" + String(now.getFullYear()).slice(2) + pad(now.getMonth() + 1) + pad(now.getDate()) + "-001";
$("qdate").textContent = now.getFullYear() + "." + pad(now.getMonth() + 1) + "." + pad(now.getDate());

function buildSvcs() {
  var box = $("svcs");
  box.innerHTML = "";
  SERVICES.forEach(function (s) {
    var d = document.createElement("div");
    d.className = "svc"; d.id = "svc-" + s.id;
    var opts = s.options.map(function (o) {
      return '<option value="' + o.id + '">' + o.label + "　" + (o.note || (yuan(o.price) + (s.qty ? " / " + s.unit : ""))) + "</option>";
    }).join("");
    var step = s.qty
      ? '<div class="step"><button type="button" data-id="' + s.id + '" data-d="-1" aria-label="减少' + s.name + '数量">−</button><output id="q-' + s.id + '">' + s.def + '</output><button type="button" data-id="' + s.id + '" data-d="1" aria-label="增加' + s.name + '数量">+</button></div><span class="unit">' + s.unit + "</span>"
      : "";
    d.innerHTML =
      '<label class="cb"><input type="checkbox" data-on="' + s.id + '" id="on-' + s.id + '">' +
      '<span class="row"><span class="box"></span><span class="name">' + s.name + '</span><span class="from">' + (s.tag || (yuan(lowest(s)) + " 起")) + "</span>" +
      '<span class="desc">' + s.desc + "</span></span></label>" +
      '<div class="opts"><select data-sel="' + s.id + '" id="sel-' + s.id + '" aria-label="' + s.name + '规格">' + opts + "</select>" + step + "</div>";
    box.appendChild(d);
  });
  box.addEventListener("change", function (e) {
    var t = e.target, on = t.getAttribute("data-on"), sel = t.getAttribute("data-sel");
    if (on) { state.on[on] = t.checked; render(); }
    if (sel) { state.opt[sel] = t.value; render(); }
  });
  box.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-id]");
    if (!b) return;
    var id = b.getAttribute("data-id");
    state.qty[id] = Math.max(1, Math.min(99, state.qty[id] + Number(b.getAttribute("data-d"))));
    render();
  });
}

function buildSeg(boxId, list, key) {
  var box = $(boxId);
  box.innerHTML = "";
  list.forEach(function (o) {
    var l = document.createElement("label");
    l.innerHTML = '<input type="radio" name="' + key + '" value="' + o.id + '"><span>' + o.label + "</span>";
    box.appendChild(l);
  });
  box.addEventListener("change", function (e) { if (e.target.name === key) { state[key] = e.target.value; render(); } });
}

function calc() {
  var lines = [], total = 0;
  SERVICES.forEach(function (s) {
    if (!state.on[s.id]) return;
    var o = find(s.options, state.opt[s.id]), q = state.qty[s.id], amt = o.price * q;
    total += amt;
    lines.push({ text: s.name + "：" + o.label.split("：")[0] + (s.qty ? " × " + q + s.unit : ""), amt: amt });
  });
  return { lines: lines, total: total };
}

function syncControls() {
  SERVICES.forEach(function (s) {
    $("svc-" + s.id).className = "svc" + (state.on[s.id] ? " on" : "");
    $("on-" + s.id).checked = !!state.on[s.id];
    $("sel-" + s.id).value = state.opt[s.id];
    if (s.qty) $("q-" + s.id).textContent = state.qty[s.id];
  });
  document.querySelectorAll("input[type=radio]").forEach(function (i) { i.checked = (state[i.name] === i.value); });
}

function render() {
  syncControls();
}

initState();
buildSvcs();
render();
</script>
